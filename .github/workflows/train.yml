name: Train Compact Coder Model

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  train:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v3
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
    
    - name: Create training data
      run: |
        mkdir -p training_data
        python -c "
import os
os.makedirs('training_data', exist_ok=True)
with open('training_data/code_samples.txt', 'w', encoding='utf-8') as f:
    f.write('''# Python Code\ndef fibonacci(n):\n    if n <= 1: return n\n    return fibonacci(n-1) + fibonacci(n-2)\n\n# JavaScript\nfunction checkPalindrome(str) {\n    return str === str.split(\"\").reverse().join(\"\");\n}\n\n# বাংলা মন্তব্য সহ\n# এটি একটি সাধারণ ফাংশন\ndef add(a, b):\n    return a + b\n''')
        "
    
    - name: Train model
      run: |
        python train_compact_coder.py
      continue-on-error: true
    
    - name: List outputs
      run: |
        ls -la
        if [ -d "model_output" ]; then ls -la model_output; fi
        if [ -d "compact_coder_model" ]; then ls -la compact_coder_model; fi
    
    - name: Upload model artifact
      if: always()
      uses: actions/upload-artifact@v3
      with:
        name: trained-model
        path: |
          model_output/
          compact_coder_model/
          training_data/
        retention-days: 30
    
    - name: Training Summary
      run: |
        echo "✅ Training pipeline completed"
        echo "Model: compact-coder-2gb"
        echo "Languages: English + Bengali"
        echo "Specialization: Programming"
